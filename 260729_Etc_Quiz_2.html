<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUV 원리 - 인터랙티브 시험</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#e11d48;--accent2:#f43f5e;--bg:#ffffff;--bg2:#fafafa;--text:#1a1a1a;--sub:#777;--border:#e5e5e5;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 100px}
.sticky{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 18px;margin:0 -18px}
.sticky-inner{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:10px;font-size:12px}
.stat{background:var(--bg2);border:1px solid var(--border);padding:6px 10px;border-radius:999px}
.stat b{color:var(--accent)}
.progress{height:8px;background:#f1f1f1;border-radius:999px;overflow:hidden;margin-top:10px}
.progress-bar{height:100%;width:0%;transition:width .4s, background .4s}
.header{padding:28px 0 16px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}
.h1{font-family:'Playfair Display',serif;font-size:28px;line-height:1.2;margin-top:6px}
.h1 span{color:var(--accent)}
.desc{color:var(--sub);font-size:13px;margin-top:8px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin:18px 0;transition:.2s}
.card.solved{border-color:#e5e7eb}
.q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.q-num{font-weight:800;font-size:14px}
.badges{display:flex;gap:6px}
.badge{font-size:10px;padding:3px 7px;border-radius:999px;border:1px solid var(--border);background:var(--bg2)}
.badge.easy{border-color:#bbf7d0;color:#15803d}
.badge.mid{border-color:#fed7aa;color:#c2410c}
.badge.hard{border-color:#fecaca;color:#b91c1c}
.q-text{font-size:15px;font-weight:500;margin-bottom:12px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);font-size:14px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent);background:#fff}
.opt.correct{background:#dcfce7;border-color:var(--ok);color:#14532d}
.opt.wrong{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.opt:disabled{cursor:not-allowed;opacity:.9}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.btn{padding:10px 14px;border-radius:999px;border:1px solid var(--text);background:var(--text);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.btn-outline{background:#fff;color:var(--text)}
.feedback{margin-top:12px;padding:12px;border-radius:10px;display:none;font-size:13px;line-height:1.6}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.feedback.no{background:#fef2f2;border:1px solid #fecaca}
.explain{margin-top:8px;color:#444;font-size:12px;background:#fff;padding:8px;border-radius:8px;border:1px dashed var(--border)}
.result-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.result-modal.show{display:flex}
.result-card{background:#fff;border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.grade{font-size:48px;font-weight:800;color:var(--accent);font-family:'Playfair Display',serif}
.ox-row{display:flex;gap:10px}
.ox-btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg2);font-size:18px;font-weight:800;cursor:pointer}
.ox-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="sticky">
  <div class="sticky-inner">
    <div style="font-weight:800;font-size:13px">EUV 원리 퀴즈</div>
    <div class="stats">
      <div class="stat">푼 문제 <b id="solved">0</b> / 10</div>
      <div class="stat">맞힌 문제 <b id="correct">0</b></div>
      <div class="stat">정답률 <b id="rate">0%</b></div>
    </div>
  </div>
  <div style="max-width:680px;margin:0 auto"><div class="progress"><div class="progress-bar" id="progBar"></div></div></div>
</div>

<div class="wrap">
  <div class="header">
    <div class="eyebrow">QUIZ · INTERACTIVE</div>
    <h1 class="h1">EUV, 제대로 이해했나? <span>10문제</span>로 확인</h1>
    <p class="desc">원본 자막에 나온 내용만 출제. 클릭하면 즉시 채점 + 해설 자동 표시. 상단 바에서 실시간 점수 확인.</p>
  </div>
  <div id="quizRoot"></div>
</div>

<div class="result-modal" id="resultModal">
  <div class="result-card">
    <div style="font-size:12px;letter-spacing:.15em;color:#e11d48;font-weight:700">FINAL SCORE</div>
    <div class="grade" id="finalGrade">B</div>
    <div style="font-size:16px;font-weight:700;margin-top:6px" id="finalText"></div>
    <div style="font-size:13px;color:#777;margin-top:8px" id="finalDetail"></div>
    <div style="margin-top:18px;display:flex;gap:8px;justify-content:center">
      <button class="btn" onclick="location.reload()">다시 풀기</button>
    </div>
  </div>
</div>

<script>
const QUIZ_DATA = [
  {
    id:1, type:'mcq', difficulty:'쉬움',
    question:'트랜지스터 크기를 작게 만들면 생기는 효과로 자막에서 설명한 것은?',
    options:['전력 소모가 늘고 성능이 낮아진다','전력 소모가 줄고 같은 면적에 더 많이 넣을 수 있다','트랜지스터 개수가 무조건 줄어든다','빛의 파장이 길어진다'],
    answer:1,
    explanation:'정답 이유: 자막에서 "작게 하면 할수록 전력 소모가 줄어들고 같은 면적에 넣을 수 있는 개수가 많아진다"고 명시. 개수가 많을수록 고성능 칩. 근거: "트랜지스터... 크기를 작게 하면 할수록 전력 소모가 줄어들고... 개수가 많아지거든요."'
  },
  {
    id:2, type:'mcq', difficulty:'쉬움',
    question:'반도체는 어떻게 만드는 방식으로 자막에서 설명했나?',
    options:['두드려 만드는 단조','틀에 붓는 주조','빛으로 패턴을 새기고 식각하는 방식','금형으로 찍어내는 프레스'],
    answer:2,
    explanation:'정답 이유: 자막에서 반도체는 눈에 보이지 않아 단조·주조·프레스로 못 만들고 "빛을 이용해서 패턴을 새기고 식각"한다고 설명. 근거: "기본적으로는 빛을 이용해서 이제 패턴을 새기고 그 패턴에 딱 맞게 식각을 하는 그런 형태로 제조가 돼요."'
  },
  {
    id:3, type:'mcq', difficulty:'보통',
    question:'파장과 회절(빛이 퍼지는 현상)의 관계로 옳은 것은?',
    options:['파장이 길수록 회절이 줄어든다','파장이 짧을수록 회절이 줄어든다','파장과 회절은 관계없다','파장이 짧을수록 회절이 무조건 0이 된다'],
    answer:1,
    explanation:'정답 이유: 자막에서 "파장이 짧은 빛일수록 회절 현상이 되게 줄어든다. 퍼질 게 이만큼만 퍼진다"고 설명. 그래서 미세한 틈(레티클) 통과 후 퍼짐을 줄이려 짧은 파장이 필요. 근거: "파장이 짧은 빛일수록 이 회절 현상이 되게 줄어드는 거예요."'
  },
  {
    id:4, type:'mcq', difficulty:'보통',
    question:'EUV 빛을 만드는 재료로 자막에서 언급된 금속은?',
    options:['철(Fe)','알루미늄(Al)','주석(Sn, TIN)','구리(Cu)'],
    answer:2,
    explanation:'정답 이유: 자막에서 주석이 EUV 빛을 만드는 재료라고 명확히 언급. 원소기호 SN, 영어 TIN. 근거: "물질 중에서 주석... 이게 이제 EUV 빛을 만드는 재료예요."'
  },
  {
    id:5, type:'mcq', difficulty:'보통',
    question:'주석 방울에 레이저를 몇 번 맞춘다고 영상에서 표현했나?',
    options:['1번','2번 – 노란색으로 펼쳐 놓고 빨간색으로 고출력','3번','4번'],
    answer:1,
    explanation:'정답 이유: 자막에서 레이저가 두 번 나온다고 설명. 노란색은 렌즈 모양으로 펼치는 역할, 빨간색은 초고출력으로 때려 플라즈마 만드는 역할. 근거: "잘 보시면은 레이저가 두 번 나오거든요. 노란색 레이저는 주석을... 넓게 펼쳐놔요. 빨간색 레이저가... 초고출력으로 빵 때리는 거거든요."'
  },
  {
    id:6, type:'mcq', difficulty:'보통',
    question:'만들어진 EUV를 한 점에 모으는 오목 거울의 이름은?',
    options:['펠리클 미러','콜렉터 미러','레티클 미러','플라즈마 미러'],
    answer:1,
    explanation:'정답 이유: 자막에서 아래쪽 오목 반사판을 콜렉터 미러라고 부른다고 설명. 근거: "아래쪽에 오목한 형태의 반사판이 있는 거거든요... 이거를 콜렉터 미러라고 부릅니다."'
  },
  {
    id:7, type:'ox', difficulty:'쉬움',
    question:'EUV 노광 장비 내부 일부는 고진공 상태로 만드는 이유는 EUV가 공기 중에서 흡수되기 때문이다.',
    options:['O','X'],
    answer:0,
    explanation:'정답 이유: O. 자막에서 EUV는 고에너지 빛이라 공기 중에서는 대기에 흡수된다고 설명. 진공이면 부딪힐 물질이 없어 흡수 안 됨. 근거: "EUV가 어려웠던 이유... 공기 중에서 앞으로 나아가지 못하고 대기에 다 흡수가 돼버리는 문제가 있었어요. 그래서... 고진공 상태로 만들어져 있어요."'
  },
  {
    id:8, type:'ox', difficulty:'보통',
    question:'EUV에서 레티클은 기존처럼 빛이 투과하는 투과형 그대로 사용된다.',
    options:['O','X'],
    answer:1,
    explanation:'정답 이유: X. EUV는 투과하면 물질에 흡수돼 사라져서 반사형으로 변경됐다고 설명. 근거: "EUV로 넘어오면서 투과형에서 반사형으로 변경이 됐는데요... EUV는... 통과를 시키면 그 통과하는 물질에 다 흡수가 돼서 사라져버렸어요. 그래서 반사형으로 바뀌게 됐습니다."'
  },
  {
    id:9, type:'short', difficulty:'어려움',
    question:'주석 방울이 고출력 레이저를 맞은 후 빛을 방출하게 되는 상태는? (세 글자)',
    options:[],
    answer:'플라즈마',
    explanation:'정답 이유: 자막에서 고에너지 받은 주석이 플라즈마가 되고 빛 형태로 에너지를 방출하며 EUV 발생한다고 설명. 근거: "이때 고에너지를 받은 주석이 이제 플라즈마가 되고 이 플라즈마가 빛의 형태로 에너지를 방출하는데 여기서 EUV 빛이 발생을 합니다."'
  },
  {
    id:10, type:'short', difficulty:'어려움',
    question:'EUV에서 펠리클을 빛이 왕복으로 통과하는 횟수는? (숫자+번, 예: 2번)',
    options:[],
    answer:'2번',
    accept:['2번','두번','2회','두 번','2'],
    explanation:'정답 이유: 자막에서 펠리클은 레티클 보호필름이고, 반사형 구조라 들어갈 때 한 번, 나올 때 한 번 총 두 번 투과해야 한다고 설명. 근거: "빛이... 펠리클을 안으로 뚫고 들어가다가 레티클에 부딪혀서 다시 밖으로 나와야 되잖아요. 그러면은 여기서 한 번, 여기서 한 번 총 두 번을 펠리클을 왔다 갔다 투과를 해야 되거든요."'
  }
];

let state={solved:0, correct:0};

function render(){
  const root=document.getElementById('quizRoot');
  root.innerHTML='';
  QUIZ_DATA.forEach((q, idx)=>{
    const card=document.createElement('div'); card.className='card'; card.id='q'+q.id;
    const diffClass=q.difficulty==='쉬움'?'easy':q.difficulty==='보통'?'mid':'hard';
    card.innerHTML=`
      <div class="q-head">
        <div class="q-num">Q${q.id}. ${q.question}</div>
        <div class="badges"><span class="badge ${diffClass}">${q.difficulty}</span><span class="badge">${q.type==='mcq'?'객관식':q.type==='ox'?'OX':'단답형'}</span></div>
      </div>
      <div class="options" id="opts-${q.id}"></div>
      <div class="feedback" id="fb-${q.id}"></div>
    `;
    root.appendChild(card);
    const optsDiv=card.querySelector(`#opts-${q.id}`);
    if(q.type==='mcq'){
      q.options.forEach((op,i)=>{
        const btn=document.createElement('button'); btn.className='opt'; btn.textContent=`${i+1}. ${op}`;
        btn.onclick=()=>checkMCQ(q.id,i);
        optsDiv.appendChild(btn);
      });
    } else if(q.type==='ox'){
      const row=document.createElement('div'); row.className='ox-row';
      q.options.forEach((op,i)=>{
        const btn=document.createElement('button'); btn.className='ox-btn'; btn.textContent=op;
        btn.onclick=()=>checkOX(q.id,i);
        row.appendChild(btn);
      });
      optsDiv.appendChild(row);
    } else {
      const row=document.createElement('div'); row.className='input-row';
      row.innerHTML=`<input type="text" id="input-${q.id}" placeholder="정답을 입력하세요"><button class="btn" id="btn-${q.id}">제출</button>`;
      optsDiv.appendChild(row);
      row.querySelector(`#btn-${q.id}`).onclick=()=>checkShort(q.id);
      row.querySelector(`#input-${q.id}`).addEventListener('keydown', e=>{if(e.key==='Enter') checkShort(q.id)});
    }
  });
}

function checkMCQ(id, sel){
  const q=QUIZ_DATA.find(x=>x.id===id);
  if(document.getElementById('q'+id).classList.contains('solved')) return;
  const opts=document.querySelectorAll(`#opts-${id} .opt`);
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer) b.classList.add('correct');
    if(i===sel && i!==q.answer) b.classList.add('wrong');
  });
  finalize(id, sel===q.answer, q.explanation, sel);
}

function checkOX(id, sel){
  const q=QUIZ_DATA.find(x=>x.id===id);
  if(document.getElementById('q'+id).classList.contains('solved')) return;
  const btns=document.querySelectorAll(`#opts-${id} .ox-btn`);
  btns.forEach((b,i)=>{
    b.disabled=true; b.style.opacity='.6';
    if(i===q.answer){ b.style.borderColor='#16a34a'; b.style.background='#dcfce7'; b.style.opacity='1' }
    if(i===sel && i!==q.answer){ b.style.borderColor='#dc2626'; b.style.background='#fee2e2'; b.style.opacity='1' }
  });
  finalize(id, sel===q.answer, q.explanation, sel);
}

function checkShort(id){
  const q=QUIZ_DATA.find(x=>x.id===id);
  if(document.getElementById('q'+id).classList.contains('solved')) return;
  const input=document.getElementById(`input-${id}`);
  const val=input.value.trim();
  if(!val) return alert('답을 입력하세요');
  input.disabled=true;
  document.getElementById(`btn-${id}`).disabled=true;
  let isCorrect=false;
  const norm=v=>v.replace(/\s/g,'').toLowerCase();
  if(q.accept){
    isCorrect=q.accept.some(a=>norm(a)===norm(val) || val.includes(a));
  } else {
    isCorrect=norm(val)===norm(q.answer) || val.includes(q.answer);
  }
  // 특별 처리: 2번 허용
  if(id===10 && (val==='2' || val.includes('2'))) isCorrect=true;
  finalize(id, isCorrect, q.explanation, val);
}

function finalize(id, isCorrect, explanation, userAns){
  const card=document.getElementById('q'+id);
  card.classList.add('solved');
  const fb=document.getElementById('fb-'+id);
  fb.classList.add('show', isCorrect?'ok':'no');
  fb.innerHTML=`<div style="font-weight:700">${isCorrect?'✓ 정답!':'✗ 오답'} ${!isCorrect?`<span style="color:#777;font-weight:400">(정답: ${QUIZ_DATA.find(x=>x.id===id).answer}${typeof QUIZ_DATA.find(x=>x.id===id).answer==='number' ? '번' : ''} ${QUIZ_DATA.find(x=>x.id===id).type==='short' ? QUIZ_DATA.find(x=>x.id===id).answer : ''})</span>`:''}</div><div class="explain"><b>해설:</b> ${explanation}</div>`;
  state.solved++; if(isCorrect) state.correct++;
  updateBoard();
  if(state.solved===10) setTimeout(showFinal, 400);
}

function updateBoard(){
  document.getElementById('solved').textContent=state.solved;
  document.getElementById('correct').textContent=state.correct;
  const rate=state.solved?Math.round(state.correct/state.solved*100):0;
  document.getElementById('rate').textContent=rate+'%';
  const bar=document.getElementById('progBar');
  bar.style.width=rate+'%';
  bar.style.background=rate<40?'#ef4444':rate<70?'#f59e0b':'#16a34a';
}

function showFinal(){
  const rate=Math.round(state.correct/10*100);
  let grade='D', msg='';
  if(rate>=90){grade='A'; msg='완벽해요! EUV 천재시네요 🎉';}
  else if(rate>=75){grade='B'; msg='훌륭해요! 핵심을 다 이해했어요 👏';}
  else if(rate>=50){grade='C'; msg='괜찮아요! 한 번 더 복습하면 완벽해질 거예요 💪';}
  else{grade='D'; msg='다시 한번 영상을 보면 더 잘 이해할 수 있어요!';}
  document.getElementById('finalGrade').textContent=grade;
  document.getElementById('finalText').textContent=`${state.correct} / 10문제 정답 (${rate}%)`;
  document.getElementById('finalDetail').textContent=msg;
  document.getElementById('resultModal').classList.add('show');
}

render();
updateBoard();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Engineering Quiz - 10 Questions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#fafafa;--text:#1a1a1a;--text2:#777;--accent:#e11d48;--accent2:#f43f5e;--border:#e5e5e5;--ok:#16a34a;--bad:#dc2626;--orange:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.6}
h1,h2{font-family:'Playfair Display',serif}
.sticky{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px}
.sticky-inner{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:14px;font-size:13px}
.stats b{font-size:18px;color:var(--text)}
.progress-wrap{max-width:720px;margin:10px auto 0;padding:0 20px}
.progress{height:8px;background:#f1f1f1;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;transition:width .4s, background .4s;background:var(--bad)}
.container{max-width:720px;margin:0 auto;padding:18px 20px 120px}
.header{padding:18px 0 8px}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.header h1{font-size:30px;line-height:1.2;margin-bottom:8px}
.header p{font-size:14px;color:var(--text2)}
.q-card{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:20px;margin:18px 0;transition:.2s}
.q-card.solved{border-color:#e5e5e5;box-shadow:0 6px 24px rgba(0,0,0,.04)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.q-num{font-family:'Playfair Display';font-size:14px;background:var(--text);color:#fff;border-radius:999px;padding:4px 10px}
.q-diff{font-size:11px;border-radius:999px;padding:4px 9px;border:1px solid var(--border);color:var(--text2)}
.q-diff.easy{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.q-diff.medium{background:#fffbeb;color:#b45309;border-color:#fde68a}
.q-diff.hard{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.q-text{font-size:16px;font-weight:600;margin:10px 0 14px;line-height:1.45}
.options{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--border);background:var(--bg2);padding:12px 14px;border-radius:12px;font-size:14px;cursor:pointer;text-align:left;transition:.18s;position:relative}
.opt:hover{border-color:var(--text);background:#fff}
.opt:disabled{cursor:not-allowed;opacity:.9}
.opt.correct{background:#dcfce7 !important;border-color:#86efac !important;color:#14532d}
.opt.wrong{background:#fee2e2 !important;border-color:#fca5a5 !important;color:#7f1d1d}
.opt .badge{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:none}
.opt.correct .badge.ok{display:inline-block;background:var(--ok);color:#fff}
.opt.wrong .badge.no{display:inline-block;background:var(--bad);color:#fff}
.short-row{display:flex;gap:8px;margin-top:8px}
.short-row input{flex:1;border:1px solid var(--border);background:var(--bg2);padding:12px 14px;border-radius:12px;font-size:14px}
.short-row button{border:1px solid var(--border);background:var(--text);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;cursor:pointer}
.explain{display:none;margin-top:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:13px;line-height:1.6}
.explain.show{display:block}
.explain b{color:var(--accent)}
.result-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.result-modal.show{display:flex}
.result-card{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.result-card h2{font-size:28px;margin-bottom:6px}
.grade{font-size:64px;font-weight:800;color:var(--accent);line-height:1;margin:12px 0}
.btn{border:1px solid var(--border);background:var(--text);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--text)}
</style>
</head>
<body>
<div class="sticky">
  <div class="sticky-inner">
    <div style="font-weight:700;font-size:14px">HARNESS QUIZ</div>
    <div class="stats">
      <div>푼 문제 <b id="solved">0</b> / 10</div>
      <div>맞힌 문제 <b id="correct">0</b></div>
      <div>정답률 <b id="percent">0%</b></div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress"><i id="bar"></i></div></div>
</div>

<div class="container">
  <div class="header">
    <div class="kicker">Interactive Quiz • 10 Questions</div>
    <h1>하네스, 정말 100번 읽은 것처럼 아시나요?</h1>
    <p>원본 자막에만 나온 내용으로 출제했습니다. 클릭하면 즉시 채점 + 해설이 펼쳐집니다. 중간에 창작된 내용은 없습니다.</p>
  </div>
  <div id="quizRoot"></div>
</div>

<div id="resultModal" class="result-modal">
  <div class="result-card">
    <div style="font-size:12px;letter-spacing:.14em;color:#777">FINAL RESULT</div>
    <h2 id="resultTitle">완료!</h2>
    <div class="grade" id="resultGrade">A</div>
    <p id="resultMsg" style="font-size:14px;color:#555;margin-bottom:18px"></p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn" onclick="resetQuiz()">다시 풀기</button>
      <button class="btn ghost" onclick="document.getElementById('resultModal').classList.remove('show')">닫기</button>
    </div>
  </div>
</div>

<script>
const QUIZ_DATA = [
  {
    id:1, type:'mc', difficulty:'easy',
    question:'하네스(Harness)라는 용어를 처음 만든 사람은 누구인가요?',
    options:['미첼 하시모토 (Mitchell Hashimoto)','샘 알트만 (Sam Altman)','리차드 서튼 (Richard Sutton)','다리오 아모데이 (Dario Amodei)'],
    answer:0,
    explanation:'정답 이유: 영상에서 "개발자 미첼 하시모토가 처음 쓴 말, 2026년 2월에 처음 나온 용어"라고 명시. AI 코딩 에이전트가 같은 실수를 반복하는 경험을 계기로 명명. 원본 근거: "개발자 미첼 하시모토가 처음 쓴 말입니다. 얼마 안됐어요. 2026년 2월에 처음 나온 용어입니다."'
  },
  {
    id:2, type:'mc', difficulty:'easy',
    question:'harness의 원래 영어 뜻은 무엇인가요?',
    options:['야생마','마구 (고삐, 안장 등 말을 다룰 때 쓰는 도구)','울타리','채찍'],
    answer:1,
    explanation:'정답 이유: 영상에서 "마구가 영어로 하네스, 마구란 곧비나 안장같이 말을 다룰 때 쓰는 도구를 말합니다"라고 설명. 원본 근거: "마구가 영어로 한해 쓰고요. 마구란 곧비나 안장같이 말을 다룰 때 쓰는 도구"'
  },
  {
    id:3, type:'mc', difficulty:'medium',
    question:'야생마 비유에서 야생마에 해당하는 것은 무엇인가요?',
    options:['클로드.md 파일','클로드, GPT, 제미나이 같은 AI 모델 자체','MCP와 스킬','프리커밋 훅'],
    answer:1,
    explanation:'정답 이유: 영상은 "AI 에이전트가 딱 이겁니다. 클로드, GPT, 제미나이 이 AI 모델 자체는 다 야생말"이라고 비유. 하네스가 그 힘을 제어하는 구조. 원본 근거: "AI 에이전트가 딱 이겁니다. 클로드, GPT, 제미나이 이 AI 모델 자체는 다 야생말입니다."'
  },
  {
    id:4, type:'ox', difficulty:'easy',
    question:'AI 모델은 혼자서 이전 대화를 기억하고 파일을 읽고 인터넷에 접속할 수 있다.',
    options:['O','X'],
    answer:1,
    explanation:'정답 이유: X가 정답. 영상에서 "AI 모델은 기본적으로 텍스트를 넣으면 텍스트만 뱉는 함수, 혼자서는 이전 대화 기억도 못하고 글도 읽지 못하고 인터넷 접속도 못한다"고 강조. 우리가 기억하는 것처럼 느끼는 건 하네스가 대화 내용을 모아서 매번 전달해주기 때문. 원본 근거: "AI 모델은 기본적으로 텍스트를 넣으면 텍스트만 뱉는 함수... 혼자서는 이전 대화 기억도 못하고"'
  },
  {
    id:5, type:'mc', difficulty:'medium',
    question:'컨텍스트 부패(Context Rot)란 무엇인가요?',
    options:['AI가 너무 많은 도구를 배워서 느려지는 현상','컨텍스트 창(한 번에 볼 수 있는 정보량)이 꽉 차서 앞 내용을 잊어버리는 현상','DB 테이블을 삭제하는 등 규칙을 어기는 현상','프롬프트가 길어져서 비용이 증가하는 현상'],
    answer:1,
    explanation:'정답 이유: 영상 정의 그대로. "컨텍스트 창이라는 게 있는데 AI가 한 번에 볼 수 있는 정보의 양... 작업이 길어질수록 이 창이 꽉 차면 앞에서 한 얘기를 잊어버리기 시작, 이거를 컨텍스트 부패라고 합니다." 엔트로픽 실험 사례로 설명됨.'
  },
  {
    id:6, type:'mc', difficulty:'medium',
    question:'규칙·울타리 문제의 대표 예시로 영상에서 든 사례는?',
    options:['AI가 로그인 페이지를 반응형으로 안 만든 경우','결제 시스템 만들라 했는데 갑자기 DB 테이블을 삭제해버리는 경우','AI가 다크모드를 지원 안 하는 경우','스킬이 수백 개 쌓여 헷갈리는 경우'],
    answer:1,
    explanation:'정답 이유: "예를 들어서 결제 시스템을 만들라고 AI에게 시켰는데 갑자기 DB 테이블을 삭제해버리면... 정보 문제가 아니라 규칙과 울타리의 문제"라고 설명. 원본 근거 그대로.'
  },
  {
    id:7, type:'mc', difficulty:'medium',
    question:'OpenAI가 3명이 5개월간 코드 한 줄 안 쓰고 만들었다는 4가지 중 포함되지 않은 것은?',
    options:['agent.md (업무 지침서)','CI 게이트 (자동 테스트)','도구 경계 설정','프롬프트 100개 작성'],
    answer:3,
    explanation:'정답 이유: 영상에 나온 4가지는 ① agent.md ② CI 게이트 ③ 도구 경계 ④ 피드백 루프. 프롬프트 100개는 해당 없음. 원본: "첫 번째, agent.md를 만들었습니다... 그리고 CI 게이트를 만들었어요... 세 번째 도구 경계를 설정... 네 번째 피드백 루프"'
  },
  {
    id:8, type:'short', difficulty:'medium',
    question:'클로드는 새 세션이 시작될 때마다 가장 먼저 읽는 프로젝트 지침 파일 이름은? (파일명 그대로 입력)',
    options:[],
    answer:'claude.md',
    explanation:'정답 이유: "클로드 코드 쓰시는 분들 claude.md 파일 보셨죠? 클로드는 새 세션이 시작될 때마다 이 파일을 가장 먼저 읽습니다. 매번 읽습니다." agent.md도 동일 역할로 인정. 원본 근거 그대로.'
  },
  {
    id:9, type:'short', difficulty:'hard',
    question:'랭체인(LangChain)이 모델 변경 없이 하네스만 개선해서 순위가 어떻게 바뀌었나요? (예: 30위에서 5위)',
    options:[],
    answer:'30위에서 5위',
    explanation:'정답 이유: "랭체인이라는 유명한 AI 개발 회사가 코딩 에이전트 벤치마크에서 모델을 바꾸지 않고 하네스만 개선을 했습니다. 그렇게 됐을 때 30위권에서 5위권으로 25단계나 올라갔습니다." 모델 그대로, 하네스만 바뀌었음.'
  },
  {
    id:10, type:'ox', difficulty:'hard',
    question:'강화학습 창시자 리차드 서튼은 "모델이 똑똑해질수록 하네스는 더 복잡해져야 한다"고 말했다.',
    options:['O','X'],
    answer:1,
    explanation:'정답 이유: X가 정답. 영상에서는 반대로 "모델이 똑똑해질수록 하네스는 더 단순해져야 한다"고 말했다고 소개. 하드코딩 규칙 추가하면 흐름 거스르는 것. 원본: "리차드 서튼이라는 강화학습 창시자가 모델이 똑똑해질수록 하네스는 더 단순해져야 한다고 얘기했어요."'
  }
];

let state = {solved:0, correct:0, answers:{}};

function render(){
  const root=document.getElementById('quizRoot');
  root.innerHTML='';
  QUIZ_DATA.forEach((q, idx)=>{
    const card=document.createElement('div');
    card.className='q-card'+(state.answers[q.id]?' solved':'');
    const isSolved=!!state.answers[q.id];
    const diffClass=q.difficulty==='easy'?'easy':q.difficulty==='hard'?'hard':'medium';
    const diffLabel=q.difficulty==='easy'?'쉬움':q.difficulty==='hard'?'어려움':'보통';
    const typeLabel=q.type==='mc'?'객관식':q.type==='ox'?'OX':'단답형';
    let html=`
      <div class="q-head"><span class="q-num">Q${idx+1}</span><span><span class="q-diff ${diffClass}">${diffLabel} · ${typeLabel}</span></span></div>
      <div class="q-text">${q.question}</div>
    `;
    if(q.type==='mc' || q.type==='ox'){
      html+=`<div class="options">`;
      q.options.forEach((opt,i)=>{
        const ans=state.answers[q.id];
        let cls='opt';
        if(ans){
          if(i===q.answer) cls+=' correct';
          if(ans.chosen===i && ans.chosen!==q.answer) cls+=' wrong';
        }
        html+=`<button class="${cls}" data-q="${q.id}" data-i="${i}" ${ans?'disabled':''}>${opt}<span class="badge ok">✓ 정답!</span><span class="badge no">✗ 오답</span></button>`;
      });
      html+=`</div>`;
    }else{
      const ans=state.answers[q.id];
      const val=ans?ans.chosenText:'';
      html+=`<div class="short-row"><input type="text" id="input-${q.id}" placeholder="정답 입력 (예: claude.md)" value="${val}" ${ans?'disabled':''}><button data-short="${q.id}" ${ans?'disabled':''}>제출</button></div>`;
      if(ans){
        html+=`<div style="margin-top:8px;font-size:12px">${ans.isCorrect?'<span style="color:#16a34a;font-weight:700">✓ 정답!</span>':'<span style="color:#dc2626;font-weight:700">✗ 오답</span> 정답: <b>${q.answer}</b>'}</div>`;
      }
    }
    html+=`<div class="explain ${isSolved?'show':''}" id="exp-${q.id}"><b>해설:</b> ${q.explanation}</div>`;
    card.innerHTML=html;
    root.appendChild(card);
  });

  // attach events
  root.querySelectorAll('button[data-q]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const qid=+btn.dataset.q;
      const chosen=+btn.dataset.i;
      grade(qid, chosen);
    });
  });
  root.querySelectorAll('button[data-short]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const qid=+btn.dataset.short;
      const input=document.getElementById('input-'+qid);
      if(!input.value.trim()){input.focus();return;}
      gradeShort(qid, input.value.trim());
    });
  });
  root.querySelectorAll('input[type=text]').forEach(inp=>{
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const qid=+inp.id.split('-')[1];
        if(!inp.value.trim()) return;
        gradeShort(qid, inp.value.trim());
      }
    });
  });
}

function grade(qid, chosen){
  if(state.answers[qid]) return;
  const q=QUIZ_DATA.find(x=>x.id===qid);
  const isCorrect=chosen===q.answer;
  state.answers[qid]={chosen, isCorrect};
  state.solved++;
  if(isCorrect) state.correct++;
  updateBoard();
  render();
  checkDone();
}

function gradeShort(qid, text){
  if(state.answers[qid]) return;
  const q=QUIZ_DATA.find(x=>x.id===qid);
  const low=text.toLowerCase().replace(/\s/g,'');
  let isCorrect=false;
  if(qid===8){
    isCorrect=low.includes('claude.md')||low.includes('claudemd')||low.includes('agent.md')||low.includes('agentmd');
  }else if(qid===9){
    const has30=low.includes('30');
    const has5=low.includes('5');
    const has25=low.includes('25');
    isCorrect=(has30&&has5)||has25||low.includes('30위에서5위')||low.includes('30->5')||low.includes('30에서5');
  }
  state.answers[qid]={chosenText:text, isCorrect, chosen:text};
  state.solved++;
  if(isCorrect) state.correct++;
  updateBoard();
  render();
  checkDone();
}

function updateBoard(){
  document.getElementById('solved').textContent=state.solved;
  document.getElementById('correct').textContent=state.correct;
  const pct=state.solved?Math.round(state.correct/state.solved*100):0;
  document.getElementById('percent').textContent=pct+'%';
  const bar=document.getElementById('bar');
  bar.style.width=(state.solved/10*100)+'%';
  if(pct<=40) bar.style.background='#e11d48';
  else if(pct<=70) bar.style.background='#f59e0b';
  else bar.style.background='#16a34a';
}

function checkDone(){
  if(state.solved===10){
    setTimeout(showResult,400);
  }
}
function showResult(){
  const pct=Math.round(state.correct/10*100);
  let grade='D', msg='';
  if(pct>=90){grade='A';msg='완벽합니다! 하네스 공식문서 100번 읽은 티가 나네요. 이제 직접 claude.md 한 줄부터 시작해보세요.'}
  else if(pct>=70){grade='B';msg='훌륭해요! 핵심 철학 "실수가 반복 불가능한 구조"를 잘 이해하셨습니다. 레벨1 세팅 2가지로 바로 적용해보세요.'}
  else if(pct>=40){grade='C';msg='좋아요! 컨텍스트 부패와 울타리 문제 두 가지 축을 다시 복습하면 금방 전문가가 됩니다.'}
  else{grade='D';msg='괜찮아요! 하네스는 이름만 거창하지 채팅창 자체도 하네스라는 것만 기억해도 절반은 온 거예요. 리포트 다시 한 번 읽어보세요.'}
  document.getElementById('resultGrade').textContent=grade;
  document.getElementById('resultTitle').textContent=`${state.correct} / 10 맞추셨습니다!`;
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('resultModal').classList.add('show');
}
function resetQuiz(){
  state={solved:0,correct:0,answers:{}};
  updateBoard();
  render();
  document.getElementById('resultModal').classList.remove('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
updateBoard();
</script>
</body>
</html>
